services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: qdrant
    ports:
      - "6333:6333"  # REST API + Web dashboard
      - "6334:6334"  # gRPC
    volumes:
      - ../../data/qdrant:/qdrant/storage
      - ../../data/qdrant_snapshots:/qdrant/snapshots
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    healthcheck:
      test:
        - "CMD"
        - "/bin/bash"
        - "-c"
        - "exec 3<>/dev/tcp/localhost/6333 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - statrag

  qdrant-backup:
    image: curlimages/curl:8.10.1
    container_name: qdrant-backup
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ../scripts/qdrant_snapshot.sh:/snapshot.sh:ro
    environment:
      QDRANT_URL: http://qdrant:6333
      SNAPSHOT_KEEP: "3"
    entrypoint: ["sh", "/snapshot.sh"]
    restart: "no"
    networks:
      - statrag

  # `chat` and `web` services are gated behind the `prod` profile so the
  # default `docker compose up -d` brings up Qdrant only. Local development
  # runs the backend and frontend directly via ``./scripts/dev.sh`` to
  # avoid port conflicts (8765 / 5173 docker vs 8766 / 5175 native).
  # Bring up the full stack with: ``docker compose --profile prod up -d``.
  chat:
    profiles: ["prod"]
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.chat
    container_name: statrag-chat
    env_file:
      - ../../.env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      TUTOR_DEEP_VISION_EXPLAIN: "1"
    ports:
      - "8765:8765"
    # Runtime SQLite state lives on the host, NOT baked into the image
    # (.dockerignore excludes chat.db so a fresh image never ships a stale
    # conversation snapshot). Bind-mount the host DBs so prod conversation
    # history + tutor checkpoints persist across rebuilds/recreates.
    volumes:
      - ../../data/chat.db:/app/data/chat.db
      - ../../data/checkpoints.db:/app/data/checkpoints.db
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - statrag

  web:
    profiles: ["prod"]
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.web
    container_name: statrag-web
    ports:
      - "5173:5173"
    depends_on:
      - chat
    restart: unless-stopped
    networks:
      - statrag

networks:
  statrag:
    driver: bridge
