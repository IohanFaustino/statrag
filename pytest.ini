[pytest]
markers =
    integration: requires running Chroma + OPENAI_API_KEY
    quality_images: live image-judge quality eval (needs OPENAI_API_KEY + labelled CSV)
    network: hits a live external API (skipped without the relevant API key)
    facilitate_eval: offline LLM-judge eval (needs live API; not in CI)
addopts = -ra -q --strict-markers -m "not quality_images and not facilitate_eval"
testpaths = tests
